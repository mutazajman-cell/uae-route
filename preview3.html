<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UAE Route — релокация в ОАЭ под ключ</title>
<meta name="description" content="Сопровождение релокации в ОАЭ. Без сказок и переплат.">
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:#f6efe3;color:#1f1a14;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}
.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}
.brand{font-weight:700;color:#1f1a14;text-decoration:none;font-size:18px}
.nav a.menu{color:#3a3127;text-decoration:none;margin-left:14px;font-size:14px}
.hero{padding:40px 0 56px;display:grid;grid-template-columns:1.2fr .9fr;gap:36px;align-items:start}
.eyebrow{display:inline-block;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:#5a4a36;background:#efe4d1;padding:6px 12px;border-radius:999px}
h1{font-size:44px;line-height:1.1;margin:18px 0 14px;font-weight:800}
h1 .mark{background:linear-gradient(transparent 60%,#ffd98a 60%);padding:0 4px}
.lead{font-size:18px;color:#3a3127;margin:0 0 22px;max-width:60ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 24px}
.pill{font-size:13px;background:#fff;border:1px solid #e6dcc7;color:#3a3127;padding:6px 12px;border-radius:999px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-flex;gap:8px;background:#25d366;color:#0b2a14;text-decoration:none;font-weight:700;padding:14px 22px;border-radius:12px;box-shadow:0 6px 18px rgba(37,211,102,.25)}
.btn-ghost{display:inline-flex;background:transparent;color:#1f1a14;text-decoration:none;font-weight:600;padding:14px 18px;border-radius:12px;border:1px solid #d9ccb1}
.hero-card{background:#fff;border:1px solid #ece1c9;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(80,60,30,.08)}
.hero-card h4{margin:0 0 14px;font-size:16px;color:#5a4a36;text-transform:uppercase;letter-spacing:.6px}
.step-list{display:grid;gap:10px}
.si{display:grid;grid-template-columns:36px 1fr;gap:12px;align-items:start;padding:10px;border-radius:12px;background:#faf3e3}
.si .n{width:36px;height:36px;border-radius:50%;background:#1f1a14;color:#f6efe3;display:flex;align-items:center;justify-content:center;font-weight:700}
.si b{display:block;font-size:15px;margin-bottom:2px}
.si span{font-size:14px;color:#3a3127}
section{padding:48px 0;border-top:1px solid #ece1c9}
h2{font-size:30px;margin:0 0 8px;font-weight:800}
.section-lead{color:#3a3127;margin:0 0 22px;max-width:70ch}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid #ece1c9;border-radius:16px;padding:20px}
.card h3{margin:0 0 8px;font-size:18px}
.card p{margin:0;color:#3a3127;font-size:15px}
.pain{background:#fff;border:1px solid #ece1c9;border-radius:14px;padding:14px 16px;display:grid;grid-template-columns:24px 1fr;gap:10px;align-items:start}
.pain .x{width:24px;height:24px;border-radius:50%;background:#f3d8d4;color:#7a2a22;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.pain b{display:block;margin-bottom:2px}
.pain span{color:#3a3127;font-size:14.5px}
.who{background:#fff;border:1px solid #ece1c9;border-radius:16px;padding:18px}
.who b{display:block;margin-bottom:6px;font-size:16px}
.who span{color:#3a3127;font-size:14.5px}
.feat{background:#fff;border:1px solid #ece1c9;border-radius:14px;padding:14px 16px}
.feat b{display:block;margin-bottom:4px}
.feat span{color:#3a3127;font-size:14.5px}
.guar{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.guar .col{background:#fff;border:1px solid #ece1c9;border-radius:16px;padding:18px}
.guar h3{margin:0 0 10px;font-size:18px}
.guar ul{margin:0;padding-left:18px;color:#3a3127;font-size:15px}
.guar ul li{margin:6px 0}
.price-card{background:#fff;border:1px solid #ece1c9;border-radius:16px;padding:22px}
.price-card p{margin:0;color:#3a3127;font-size:16px}
.faq details{background:#fff;border:1px solid #ece1c9;border-radius:12px;padding:14px 16px;margin-bottom:10px}
.faq summary{cursor:pointer;font-weight:600}
.faq p{margin:10px 0 0;color:#3a3127}
footer{padding:30px 0 50px;color:#5a4a36;font-size:14px;border-top:1px solid #ece1c9}
@media (max-width:780px){.hero{grid-template-columns:1fr;padding:24px 0 36px}h1{font-size:32px}.grid3,.grid2,.guar{grid-template-columns:1fr}}
</style>
</head>
<body>
